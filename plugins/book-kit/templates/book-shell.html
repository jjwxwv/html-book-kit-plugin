<!DOCTYPE html>
<html lang="{{LANG}}" data-chapter="index" data-level="{{LEVEL}}" data-palette="{{PALETTE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="book-kit {{KIT_VERSION}}">
<meta name="book-kit:template" content="11">
<title>{{BOOK_TITLE}}</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/style.css">
<script>
/* before first paint: stored theme, palette and text size (no flash) */
(function(){var d=document.documentElement,k="hbk:{{BOOK_SLUG}}:";d.classList.add("js");try{var g=function(n){var v=localStorage.getItem(k+n);return v===null?null:JSON.parse(v)};var m=g("theme");if(m!=="light"&&m!=="dark")m=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",m);var p=g("palette");if(p&&{{PALETTE_NAMES}}.indexOf(p)>=0)d.setAttribute("data-palette",p);var f=g("fs");if(f===-1||f===1||f===2)d.setAttribute("data-fs",String(f));if(g("tocHidden")===true)d.classList.add("toc-hidden")}catch(e){d.setAttribute("data-theme","light")}})();
</script>
{{HEAD_EXTRA}}
</head>
<body>
<a class="skip" href="#main">{{T_SKIP}}</a>
<div id="progress" role="progressbar" aria-label="{{T_PROGRESS}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
<header class="topbar">
  <button id="toc-open" class="icon-btn" type="button" aria-label="{{T_TOC_OPEN}}" aria-controls="toc" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="book-title" href="index.html">{{BOOK_TITLE}}</a>
  <span class="level-badge">{{LEVEL_LABEL}}</span>
  <button id="appearance-open" class="icon-btn" type="button" aria-label="{{T_APPEARANCE}}" aria-controls="appearance" aria-expanded="false">Aa</button>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="{{T_THEME}}"><svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg><svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</header>
{{APPEARANCE_HTML}}
<div class="layout">
{{TOC_HTML}}
<main id="main" class="content">
  <article class="content-inner wide">
    <header class="cover">
      <p class="cover-kicker">{{LEVEL_LABEL_LONG}}</p>
      <h1>{{BOOK_TITLE}}</h1>
      <p class="subtitle">{{BOOK_SUBTITLE}}</p>
      <p class="author">{{BOOK_AUTHOR}}</p>
      <div class="cover-actions">
        <a class="btn primary" id="start-link" href="{{FIRST_CHAPTER_HREF}}">{{T_START}}</a>
        <a class="btn" id="resume-link" href="{{FIRST_CHAPTER_HREF}}" hidden></a>
      </div>
      <p class="cover-meta">{{COVER_META}}</p>
    </header>
    <section class="agenda" aria-labelledby="agenda-title">
      <h2 id="agenda-title">{{T_AGENDA}}</h2>
{{AGENDA_HTML}}
    </section>
  </article>
</main>
</div>
<div class="scrim" hidden></div>
<script src="assets/book-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
